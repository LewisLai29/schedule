  <script>
    const ENTITIES = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    };

    function cellText(cell) {
      return cell && typeof cell.text === 'string' ? cell.text.trim() : '';
    }

    function cellUrl(cell) {
      const value = cell && typeof cell.url === 'string' ? cell.url.trim() : '';
      return /^https?:\/\//i.test(value) ? value : '';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ENTITIES[character]);
    }

    function linkMarkup(cell, label) {
      const text = label ?? cellText(cell);
      if (!text) return '';

      const url = cellUrl(cell);
      if (!url) return escapeHtml(text);

      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>`;
    }

    function buttonMarkup(cell, label) {
      const url = cellUrl(cell);
      if (!url) return '';
      return `<a class="link-btn" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
    }

    function formatTime(value) {
      const raw = String(value ?? '').trim();
      const match = raw.match(/^(\d{1,2}):(\d{2})/);
      return match ? `${match[1].padStart(2, '0')}:${match[2]}` : raw;
    }

    function splitEvent(cell, fallbackTime) {
      const raw = cellText(cell);
      const match = raw.match(/^([01]?\d|2[0-3]):([0-5]\d)(?:\s+|$)([\s\S]*)$/);
      const text = match && match[3].trim() ? match[3].trim() : raw;
      const route = text.match(/^([A-Z]{3})\s*(?:->|>|→)\s*([A-Z]{3})$/);
      return {
        time: match ? formatTime(`${match[1]}:${match[2]}`) : route ? '' : fallbackTime,
        text: route ? `${route[1]} → ${route[2]}` : text,
        isJourney: Boolean(route && !match),
        url: cellUrl(cell)
      };
    }

    function parseDate(value) {
      const raw = String(value ?? '').trim();
      const match = raw.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s*\(([^)]+)\)/);

      if (!match) return { monthDay: raw, weekday: '', full: raw };

      const monthDay = `${match[2].padStart(2, '0')}/${match[3].padStart(2, '0')}`;
      return {
        monthDay,
        weekday: match[4],
        full: `${match[1]}/${match[2].padStart(2, '0')}/${match[3].padStart(2, '0')}（${match[4]}）`
      };
    }

    function isAccommodationText(value) {
      return /\b(?:hotel|inn)\b/i.test(String(value || ''));
    }

    function scheduleCard(rows, column, index, totalColumns) {
      const dateCell = rows[0]?.[column];
      const placeCell = rows[1]?.[column];
      const date = parseDate(cellText(dateCell));
      // Compare the full date using the visitor's device timezone.
      const dateParts = cellText(dateCell).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
      const today = new Date();
      const isToday = dateParts && Number(dateParts[1]) === today.getFullYear()
        && Number(dateParts[2]) === today.getMonth() + 1
        && Number(dateParts[3]) === today.getDate();
      const place = cellText(placeCell);
      const events = [];

      for (let rowIndex = 2; rowIndex < rows.length; rowIndex += 1) {
        const cell = rows[rowIndex]?.[column];
        if (!cellText(cell)) continue;
        // Expanded merged cells retain their bounds; render once per day column.
        if (Number.isInteger(cell.mergeStartRow) && rowIndex > cell.mergeStartRow) continue;
        const startTime = formatTime(cellText(rows[rowIndex]?.[0]));
        events.push(splitEvent(cell, startTime));
      }

      const lastEventIndex = events.length - 1;
      const displayEvents = events
        .map((event, eventIndex) => ({
          ...event,
          isAccommodation: eventIndex === lastEventIndex && isAccommodationText(event.text),
        }))
        .filter((event) => !(index === totalColumns && event.isAccommodation));
      const isFlightDay = displayEvents.some((event) => /IT714|IT715|TPE|OKJ|機場|起飛|降落/.test(event.text));
      const title = index === 1 ? '抵達日本' : index === 8 ? '回程' : (place || '彈性安排');
      const label = place || (index === 1 ? '前往岡山' : index === 8 ? '返回岡山' : '—');
      const tag = isFlightDay ? '航班日' : displayEvents.length ? '行程' : '待補';

      const eventMarkup = displayEvents.length
        ? `<div class="events">${displayEvents.map((event) => `
            <div class="event${event.isAccommodation ? ' accommodation-event' : ''}${event.isJourney ? ' journey-event' : ''}">
              ${event.isAccommodation ? '' : `<div class="event-time">${escapeHtml(event.time)}</div>`}
              <div class="event-text">${event.isJourney ? '<span class="journey-icon" aria-hidden="true">✈</span>' : ''}${linkMarkup({ text: event.text, url: event.url })}</div>
            </div>`).join('')}</div>`
        : '<div class="empty-day">原始 schedule 尚未填寫行程。</div>';

      return `<details class="day-card"${isToday ? ' open' : ''}>
        <summary class="day-label">
          <div class="day-number">DAY ${String(index).padStart(2, '0')}</div>
          <div class="day-date">${escapeHtml(date.monthDay)}${date.weekday ? `<br>週${escapeHtml(date.weekday)}` : ''}</div>
          <div class="day-place">${escapeHtml(label)}</div>
        </summary>
        <div class="day-body">
          <div class="day-title"><h3>${escapeHtml(title)}</h3><span class="tag">${escapeHtml(tag)}</span></div>
          ${eventMarkup}
        </div>
      </details>`;
    }

    function enableScheduleAnimation() {
      document.querySelectorAll('.day-card').forEach((card) => {
        const summary = card.querySelector('summary');
        let animation = null;
        let expanded = card.open;
        summary.addEventListener('click', (event) => {
          if (event.target.closest('a, button')) return;
          event.preventDefault();
          const startHeight = card.getBoundingClientRect().height;
          expanded = !expanded;
          if (animation) {
            animation.onfinish = null;
            animation.cancel();
            animation = null;
          }
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !card.animate) {
            card.open = expanded;
            return;
          }
          // Measure natural dimensions, including borders, without leaving a fixed height.
          card.open = expanded;
          const endHeight = card.getBoundingClientRect().height;
          card.open = true;
          animation = card.animate(
            [{ height: `${startHeight}px` }, { height: `${endHeight}px` }],
            { duration: 260, easing: 'cubic-bezier(0.2, 0, 0, 1)' }
          );
          animation.onfinish = () => {
            card.open = expanded;
            animation = null;
          };
        });
      });
    }

    function renderSchedule(rows) {
      const columns = 8;
      const firstDate = parseDate(cellText(rows[0]?.[1]));
      const lastDate = parseDate(cellText(rows[0]?.[columns]));
      document.getElementById('trip-dates').textContent = `${firstDate.full} — ${lastDate.full}`;
      document.getElementById('schedule-grid').innerHTML = Array.from(
        { length: columns },
        (_, index) => scheduleCard(rows, index + 1, index + 1, columns)
      ).join('');
      enableScheduleAnimation();

      const sidePlace = cellText(rows[1]?.[10]);
      const sideItems = [];
      for (let rowIndex = 2; rowIndex < rows.length; rowIndex += 1) {
        const cell = rows[rowIndex]?.[10];
        if (Number.isInteger(cell?.mergeStartRow) && rowIndex > cell.mergeStartRow) continue;
        if (cellText(cell)) sideItems.push(cell);
      }

      if (!sidePlace && !sideItems.length) {
        document.getElementById('schedule-notes').innerHTML = '';
        return;
      }

      document.getElementById('schedule-notes').innerHTML = `<div class="note-card" style="margin-top: 18px;">
        <h3>${escapeHtml(sidePlace || '其他景點備忘')}</h3>
        <p>這組內容在原始 schedule 的日期行程旁獨立列出，先保留為備選景點。</p>
        <div class="chip-list">${sideItems.map((cell) => `<span class="place-chip">${linkMarkup(cell)}</span>`).join('')}</div>
      </div>`;
    }

    function parseSpotGroups(rows, defaultName) {
      const groups = [];
      let current = null;

      rows.forEach((row) => {
        const a = row?.[0] || {};
        const b = row?.[1] || {};
        const c = row?.[2] || {};
        const d = row?.[3] || {};
        const aText = cellText(a);
        const bText = cellText(b);
        const note = /^(備註|備注|備考|notes?)$/i.test(cellText(c)) ? null : c;

        if (aText && !bText && !cellText(c) && !cellText(d) && !cellUrl(a)) {
          current = { name: aText, items: [], resources: [] };
          groups.push(current);
          return;
        }

        if (!current) {
          if (!aText && !cellText(c) && !cellText(d)) return;
          current = { name: defaultName, items: [], resources: [] };
          groups.push(current);
        }

        if (aText && (bText || cellUrl(a) || cellUrl(b) || cellText(note))) {
          current.items.push({ name: a, english: b, note, isLink: Boolean(cellUrl(a)) });
        }
        if (cellText(d)) current.resources.push(d);
      });

      return groups;
    }

    function spotGroupMarkup(group, cityTitle) {
      const items = group.items.map((item) => {
        const note = cellText(item.note)
          ? `<span class="spot-note">${linkMarkup(item.note)}</span>` : '';

        if (item.isLink) {
          return `<li class="spot-resource-row"><div class="spot-resource-content"><a class="spot-resource-link" href="${escapeHtml(cellUrl(item.name))}" target="_blank" rel="noopener noreferrer"><span>${escapeHtml(cellText(item.name))}${cellText(item.english) ? `<span class="spot-en">${escapeHtml(cellText(item.english))}</span>` : ''}</span><span class="spot-resource-arrow" aria-hidden="true">↗</span></a>${note}</div></li>`;
        }

        return `<li>
          <div class="spot-item-content"><div class="spot-name">${escapeHtml(cellText(item.name))}<span class="spot-en">${escapeHtml(cellText(item.english))}</span></div>${note}</div>
        </li>`;
      }).join('');

      const resources = group.resources.length
        ? `<div class="resource-list">${group.resources.map((cell) => {
            const url = cellUrl(cell);
            return url ? linkMarkup(cell) : `<div class="resource-list-item">${escapeHtml(cellText(cell))}</div>`;
          }).join('')}</div>`
        : '';

      return `<article class="spot-group">
        ${group.name.trim().toLowerCase() !== cityTitle.trim().toLowerCase() ? `<h4 class="spot-subheading">${escapeHtml(group.name)}</h4>` : ''}
        ${items ? `<ul class="spot-list">${items}</ul>` : ''}
        ${resources}
      </article>`;
    }

    function spotSheetTitle(sheetName) {
      return String(sheetName || '').replace(/\s*spot\s*$/i, '').trim() || '景點';
    }

    function parseSpotSheet(sheet) {
      const rows = Array.isArray(sheet.rows) ? sheet.rows : [];
      return parseSpotGroups(rows, spotSheetTitle(sheet.name));
    }

    function renderSpotSheets(data) {
      const sections = Array.isArray(data.spotSheets) ? data.spotSheets : [];
      document.getElementById('spot-groups').innerHTML = sections.length
        ? sections.map((sheet) => {
            const groups = parseSpotSheet(sheet);
            const title = spotSheetTitle(sheet.name);
            const count = groups.reduce((total, group) => total + group.items.filter((item) => !item.isLink).length, 0);
            const details = spotInfoMarkup(parseSpotDetails(sheet.rows || []));
            return `<section class="spot-sheet">
              <header class="spot-sheet-header"><h3 class="spot-sheet-title">${escapeHtml(title)}</h3><span class="spot-count">${count} 個景點</span></header>
              <div class="spot-sheet-groups">${groups.length
                ? groups.map((group) => spotGroupMarkup(group, title)).join('')
                : '<p class="empty-day">目前尚未填寫景點。</p>'}</div>
              ${details}
            </section>`;
          }).join('')
        : '<div class="loading">目前沒有景點資料。</div>';
    }

    function parseSpotDetails(rows) {
      const facts = [];
      const prices = [];
      let date = '';

      rows.forEach((row) => {
        const e = row?.[4] || {};
        const f = row?.[5] || {};
        const h = row?.[7] || {};
        const i = row?.[8] || {};

        if (cellText(e) === '日期') {
          date = cellText(f);
        } else if (cellText(e) && cellText(f)) {
          facts.push({ label: e, value: f });
        }

        if (cellText(h) && cellText(i)) prices.push({ label: h, value: i });
      });

      return { facts, prices, date };
    }

    function spotInfoMarkup(spotData) {
      if (!spotData.date && !spotData.facts.length && !spotData.prices.length) return '';
      const facts = spotData.facts.map((fact) => `<div class="fact"><dt>${escapeHtml(cellText(fact.label))}</dt><dd>${escapeHtml(cellText(fact.value))}</dd></div>`).join('');
      const prices = spotData.prices.map((price) => `<div class="price"><span>${escapeHtml(cellText(price.label))}</span><strong>${escapeHtml(cellText(price.value))}</strong></div>`).join('');
      const afterOpen = spotData.facts.find((fact) => cellText(fact.label) === '17:00後開放區域');
      const afterClosed = spotData.facts.find((fact) => cellText(fact.label) === '17:00後不開放');
      const callout = afterOpen || afterClosed
        ? `<div class="callout">${afterOpen ? `<strong>17:00 後：</strong>${escapeHtml(cellText(afterOpen.value))}。` : ''}${afterClosed ? `<br><strong>不開放：</strong>${escapeHtml(cellText(afterClosed.value))}。` : ''}</div>`
        : '';

      return `<div class="spot-info-layout">${spotData.date || spotData.facts.length ? `<section class="spot-info-section">
        <h4 class="spot-subheading">時間與開放資訊</h4>
        ${spotData.date ? `<div class="date-note">${escapeHtml(spotData.date)}</div>` : ''}
        <dl class="facts">${facts}</dl>
        ${callout}
      </section>` : ''}
      ${spotData.prices.length ? `<section class="spot-info-section">
        <h4 class="spot-subheading">票價</h4>
        <div class="price-list">${prices || '<div class="empty-day">尚未填寫票價。</div>'}</div>
      </section>` : ''}</div>`;
    }

    function renderFood(rows) {
      const nonEmptyRows = rows.filter((row) => row.some((cell) => cellText(cell)));
      if (!nonEmptyRows.length) {
        document.getElementById('food-content').innerHTML = '<div class="food-empty"><div class="food-mark">—</div><p>目前尚未填寫餐廳或用餐資料。</p></div>';
        return;
      }

      document.getElementById('food-content').innerHTML = `<div class="food-table">${nonEmptyRows.map((row) => `<div class="food-row">${row.filter((cell) => cellText(cell)).map((cell) => `<div class="food-cell">${linkMarkup(cell)}</div>`).join('')}</div>`).join('')}</div>`;
    }

    function removeLegacyKobeSection() {
      document.getElementById('kobe')?.remove();
      document.getElementById('kobe-spots')?.remove();
      document.querySelectorAll('.nav a[href="#kobe"]').forEach((link) => link.remove());
    }

    function renderHotels(rows) {
      const names = [];
      const seen = new Set();
      const isHeading = (text) => /^(hotel|hotels|name|hotel name|住宿|飯店|旅館|名稱|飯店名稱|住宿名稱)$/i.test(text);
      rows.forEach((row) => {
        const first = cellText(row?.[0]);
        if (isHeading(first)) return;
        const name = first || cellText(row?.[1]);
        const key = name.toLowerCase().replace(/\s+/g, ' ');
        if (!name || isHeading(name) || seen.has(key)) return;
        seen.add(key);
        names.push(name);
      });
      const chip = document.getElementById('trip-hotels');
      if (chip) chip.textContent = `住宿：${names.length ? names.join('、') : '尚未填寫'}`;
    }

    function renderTrip(data) {
      removeLegacyKobeSection();
      window.TRIP_SPOT_REFERENCES = Array.isArray(data.spotReferences) ? data.spotReferences : [];
      renderHotels(data.hotel || []);
      renderSchedule(data.schedule || []);

      renderSpotSheets(data);
      renderFood(data.food || []);
      document.getElementById('updated-at').textContent = data.updatedAt || '—';
    }

  </script>

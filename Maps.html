  <script>
    function mapRouteLocation(url) {
      try {
        var parsed = new URL(url);
        if (!/^(?:www\.|maps\.)?google\.(?:com|co\.jp|com\.tw)$/i.test(parsed.hostname)) return null;
        var decoded = decodeURIComponent(parsed.href);
        var query = parsed.searchParams.get('query') || parsed.searchParams.get('q') || '';
        var embeddedId = decoded.match(/!1s(ChI[\w-]+)(?:!|\?|&|$)/);
        var placeId = parsed.searchParams.get('query_place_id') || (embeddedId ? embeddedId[1] : '');
        if (query.startsWith('place_id:')) {
          placeId = query.slice(9);
          query = '';
        }
        // !3d/!4d identify the place; @ coordinates are only the camera center.
        var point = decoded.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)
          || decodeURIComponent(parsed.pathname).match(/\/place\/(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)(?:\/|$)/);
        var coordinates = point ? point[1] + ',' + point[2] : '';
        if (placeId) return { value: coordinates || query, placeId: placeId };
        if (coordinates) return { value: coordinates };
        if (query && !/^https?:/i.test(query)) return { value: query };
      } catch (error) { /* An unresolved link is not a usable route endpoint. */ }
      return null;
    }

    function normalizeLocationName(value) {
      return String(value || '').normalize('NFKC').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function buildTripLocationIndex(data) {
      const resolvedUrls = new Map((data.mapLocations || []).map((location) => [
        location.originalUrl || location.url, location.url
      ]));
      const parsedUrls = new Map();
      const isHeading = (name) => /^(名稱|餐廳|餐廳名稱|店名|住宿|飯店|旅館|飯店名稱|住宿名稱|name|restaurant|hotel|hotels|hotel name)$/i.test(name);
      const mapUrl = (cell) => [cell?.mapUrl || '', cellUrl(cell), cellText(cell)].find((url) =>
        /^https:\/\/(?:maps\.app\.goo\.gl\/|goo\.gl\/maps(?:\/|\?)|(?:www\.|maps\.)?google\.(?:com|co\.jp|com\.tw)\/(?:maps(?:\/|\?)|\?))/i.test(url)
      ) || '';
      function fromRows(rows, source, isSpot) {
        const index = new Map();
        rows.forEach((row) => {
          const name = cellText(row[0]) || (!isSpot ? cellText(row[1]) : '');
          if (!name || isHeading(name)) return;
          // A spot row containing only its first column is a group heading.
          if (isSpot && !cellText(row[1]) && !mapUrl(row[0]) && !mapUrl(row[1]) && !cellUrl(row[0]) && !cellUrl(row[1]) && !cellText(row[2])) return;
          const originalUrl = mapUrl(row[1]) || mapUrl(row[0]);
          const url = resolvedUrls.get(originalUrl) || originalUrl;
          if (!parsedUrls.has(url)) parsedUrls.set(url, mapRouteLocation(url));
          const location = { name, source, url: originalUrl, resolvedUrl: url, endpoint: parsedUrls.get(url) };
          const alias = cellText(row[1]);
          [name, alias && !/^https?:\/\//i.test(alias) && !isHeading(alias) ? alias : ''].forEach((key) => {
            key = normalizeLocationName(key);
            if (!key) return;
            const existing = index.get(key);
            if (!existing || (!existing.endpoint && location.endpoint) || (!existing.url && location.url)) index.set(key, location);
          });
        });
        return index;
      }
      const sources = (data.spotSheets || []).map((sheet) => fromRows(sheet.rows || [], sheet.name, true));
      sources.push(fromRows(data.food || [], 'food', false));
      sources.push(fromRows(data.hotel || [], 'hotel', false));
      const index = new Map();
      sources.forEach((source) => source.forEach((location, key) => {
        const existing = index.get(key);
        // Prefer a usable endpoint over an unresolved duplicate.
        if (!existing || (!existing.endpoint && location.endpoint) || (!existing.url && location.url)) index.set(key, location);
      }));
      return index;
    }

    function getTripLocation(name) {
      return window.TRIP_LOCATION_INDEX?.get(normalizeLocationName(name));
    }

    function routeUrl(origin, destination) {
      const start = getTripLocation(origin)?.endpoint;
      const end = getTripLocation(destination)?.endpoint;
      if (!start || !end) return null;
      const params = new URLSearchParams({
        api: '1', origin: start.value || origin,
        destination: end.value || destination, travelmode: 'transit'
      });
      if (start?.placeId) params.set('origin_place_id', start.placeId);
      if (end?.placeId) params.set('destination_place_id', end.placeId);
      return 'https://www.google.com/maps/dir/?' + params.toString();
    }

    function setRouteLink(link, origin, destination) {
      const url = routeUrl(origin, destination);
      if (url) {
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      } else if ([origin, destination].every((name) => {
        const location = getTripLocation(name);
        return location?.endpoint || /^https:\/\/(?:maps\.app\.goo\.gl|goo\.gl)\//i.test(location?.url || '');
      })) {
        const label = link.textContent;
        link.setAttribute('role', 'button');
        link.tabIndex = 0;
        link.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            link.click();
          }
        });
        link.addEventListener('click', function (event) {
          if (link.hasAttribute('href')) return;
          event.preventDefault();
          if (link.getAttribute('aria-busy') === 'true') return;
          const routeWindow = window.open('about:blank', '_blank');
          if (routeWindow) routeWindow.opener = null;
          link.textContent = '正在取得路線…';
          link.setAttribute('aria-busy', 'true');
          const fail = function (error) {
            if (routeWindow && !routeWindow.closed) routeWindow.close();
            link.removeAttribute('aria-busy');
            link.textContent = label + '（無法取得位置，點此重試）';
            link.title = error?.message || '請確認景點或餐廳的地圖連結。';
          };
          const pendingUrls = [origin, destination].map(getTripLocation)
            .filter((location) => !location.endpoint).map((location) => location.url);
          try {
            google.script.run.withSuccessHandler(function (locations) {
              try {
                locations.forEach(function (resolved) {
                  window.TRIP_LOCATION_INDEX.forEach(function (location) {
                    if (location.url !== resolved.originalUrl) return;
                    location.resolvedUrl = resolved.url;
                    location.endpoint = mapRouteLocation(resolved.url);
                  });
                });
                const resolvedRoute = routeUrl(origin, destination);
                if (!resolvedRoute) throw new Error('地圖連結中找不到可用的位置。');
                link.removeAttribute('aria-busy');
                link.removeAttribute('role');
                link.removeAttribute('title');
                link.textContent = label;
                link.href = resolvedRoute;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                if (routeWindow && !routeWindow.closed) routeWindow.location.replace(resolvedRoute);
                else link.textContent = label + '（路線已就緒，點此開啟）';
              } catch (error) { fail(error); }
            }).withFailureHandler(fail).resolveMapLocations(pendingUrls);
          } catch (error) { fail(error); }
        });
      } else {
        const missing = [origin, destination].filter((name) => !getTripLocation(name)?.endpoint);
        link.removeAttribute('href');
        link.setAttribute('aria-disabled', 'true');
        link.title = '無法取得地圖位置：' + missing.join('、');
        link.textContent += window.TRIP_MAP_DATA_ERROR ? '（地圖資料未載入）' : '（無法取得位置）';
        link.setAttribute('aria-label', link.textContent + '。' + link.title);
      }
    }

    // Called once after each completed trip render.
    const initializeTripMaps = (function () {
      var mapSequence = 0;

      function plainName(element) {
        return Array.from(element.childNodes).filter(function (node) {
          return !node.hasAttribute || !node.hasAttribute('data-trip-map');
        }).map(function (node) { return node.textContent; }).join(' ').trim();
      }

      function addDayRoutes() {
        var previousAccommodation = '';
        document.querySelectorAll('.day-card').forEach(function (day) {
          var stops = [];
          day.querySelectorAll('.event').forEach(function (event) {
            var name = getTripLocation(plainName(event.querySelector('.event-text')))?.name;
            if (name) stops.push({ name: name, event: event });
          });
          var firstStop = stops.find(function (stop) {
            return !stop.event.classList.contains('accommodation-event');
          });
          if (previousAccommodation && firstStop && !day.querySelector('.accommodation-route')) {
            var arrivalLink = document.createElement('a');
            arrivalLink.className = 'transit-route accommodation-route';
            arrivalLink.textContent = previousAccommodation + ' → ' + firstStop.name;
            arrivalLink.setAttribute('aria-label', '查看前一天住宿 ' + previousAccommodation + ' 到 ' + firstStop.name + ' 的大眾運輸路線');
            setRouteLink(arrivalLink, previousAccommodation, firstStop.name);
            var arrivalRow = document.createElement('div');
            arrivalRow.className = 'day-arrival-route';
            arrivalRow.appendChild(arrivalLink);
            var events = day.querySelector('.events');
            events.parentNode.insertBefore(arrivalRow, events);
          }
          stops.slice(0, -1).forEach(function (stop, index) {
            if (stop.event.querySelector('.transit-route:not(.accommodation-route)')) return;
            var destination = stops[index + 1].name;
            var link = document.createElement('a');
            link.className = 'transit-route';
            link.textContent = '→ ' + destination;
            link.setAttribute('aria-label', '查看 ' + stop.name + ' 到 ' + destination + ' 的大眾運輸路線');
            setRouteLink(link, stop.name, destination);
            stop.event.appendChild(link);
          });
          var accommodation = day.querySelector('.accommodation-event .event-text');
          var accommodationName = accommodation ? plainName(accommodation) : '';
          previousAccommodation = getTripLocation(accommodationName)?.name || accommodationName;
        });
      }

      // Place previews always expand inline, independently of route endpoints.
      function addPlaceMapToggles() {
        var places = document.querySelectorAll('.spot-list .spot-name, .food-name');
        places.forEach(function (place) {
          try {
            var isFood = place.classList.contains('food-name');
            var target = place.closest(isFood ? '.food-row' : 'li');
            if (!target || target.querySelector('[data-trip-map]')) return;
            var name = Array.from(place.childNodes).filter(function (node) {
              return node.nodeType === 3;
            }).map(function (node) { return node.textContent; }).join('').trim();
            if (isFood) name = plainName(place);
            else if (!name) name = (place.querySelector('.spot-en')?.textContent || '').trim();
            if (isFood && /^(名稱|餐廳|餐廳名稱|店名|name|restaurant)$/i.test(name)) return;
            if (!name) return;
            var panel = document.createElement('div');
            panel.className = 'event-map spot-map';
            panel.setAttribute('data-trip-map', 'true');
            panel.id = 'trip-map-' + (++mapSequence);
            panel.hidden = true;
            var frame = document.createElement('iframe');
            frame.title = name + ' Google Maps';
            frame.loading = 'lazy';
            frame.referrerPolicy = 'no-referrer-when-downgrade';
            frame.allowFullscreen = true;
            frame.dataset.mapSrc = 'https://www.google.com/maps?q=' + encodeURIComponent(name + ' 日本') + '&output=embed&hl=zh-TW';
            panel.appendChild(frame);
            var link = document.createElement('a');
            link.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name + ' 日本');
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '在 Google Maps 開啟';
            link.title = '在 Google Maps 搜尋：' + name;
            link.setAttribute('aria-label', link.title);
            panel.appendChild(link);
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'map-toggle';
            button.setAttribute('data-trip-map', 'true');
            button.setAttribute('aria-controls', panel.id);
            button.setAttribute('aria-expanded', 'false');
            button.textContent = '顯示地圖';
            var expanded = false;
            var animation = null;
            button.addEventListener('click', function () {
              var startHeight = panel.hidden ? 0 : panel.getBoundingClientRect().height;
              var startOpacity = panel.hidden ? 0 : Number(getComputedStyle(panel).opacity);
              var startMargin = panel.hidden ? -12 : parseFloat(getComputedStyle(panel).marginTop);
              expanded = !expanded;
              if (animation) {
                animation.onfinish = null;
                animation.cancel();
                animation = null;
              }
              button.textContent = expanded ? '隱藏地圖' : '顯示地圖';
              button.setAttribute('aria-expanded', String(expanded));
              panel.inert = !expanded;
              if (expanded && frame.dataset.mapSrc) {
                frame.src = frame.dataset.mapSrc;
                delete frame.dataset.mapSrc;
              }
              if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !panel.animate) {
                panel.hidden = !expanded;
                panel.style.overflow = '';
                return;
              }
              panel.hidden = false;
              var endHeight = expanded ? panel.getBoundingClientRect().height : 0;
              panel.style.overflow = 'hidden';
              animation = panel.animate([
                { height: startHeight + 'px', opacity: startOpacity, marginTop: startMargin + 'px' },
                { height: endHeight + 'px', opacity: expanded ? 1 : 0, marginTop: expanded ? '0px' : '-12px' }
              ], { duration: 260, easing: 'cubic-bezier(0.2, 0, 0, 1)' });
              animation.onfinish = function () {
                panel.hidden = !expanded;
                panel.style.overflow = '';
                animation = null;
              };
            });
            target.appendChild(button);
            target.classList.add('has-map');
            target.appendChild(panel);
          } catch (error) {
            console.warn('略過地圖按鈕：', error);
          }
        });
      }
      return function initializeTripMaps() {
        try { addDayRoutes(); } catch (error) { console.warn('交通路線未啟用：', error); }
        try { addPlaceMapToggles(); } catch (error) { console.warn('小地圖未啟用：', error); }
      };
    })();
  </script>

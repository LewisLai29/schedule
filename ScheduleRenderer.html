  <script>
    function trafficNoteMarkup(note, rows) {
      const normalize = (value) => String(value || '').normalize('NFKC').trim().replace(/\s+/g, ' ').toLowerCase();
      const references = String(note || '').split(/\r?\n/).map(normalize).filter(Boolean);
      const found = new Set();
      return references.map((reference) => {
        let row = rows.find((item) => cellText(item?.[0]) && normalize(cellText(item[0])) === reference);
        // "traffic 1" can also address the first physical row, with A as its readable title.
        const rowReference = reference.match(/^traffic\s+(\d+)$/);
        if (!row && rowReference) row = rows[Number(rowReference[1]) - 1];
        if (!row || !cellText(row[0]) || found.has(row)) return '';
        found.add(row);
        const title = cellText(row[0]);
        const information = row.slice(1).map((cell) => {
          if (!cell) return '';
          const candidate = cellUrl(cell) || cellUrl({ url: cellText(cell) });
          const imageUrl = cellUrl({ url: cell.imageUrl })
            || (/\.(?:png|jpe?g|gif|webp|bmp|avif)(?:[?#].*)?$/i.test(candidate) ? candidate : '');
          if (imageUrl || cell.imageRef) {
            return `<button type="button" class="traffic-image" aria-haspopup="dialog" aria-label="${escapeHtml(title)}：放大查看圖片"><img${imageUrl ? ` src="${escapeHtml(imageUrl)}"` : ''}${sheetImageAttributes(cell)} referrerpolicy="no-referrer" alt="${escapeHtml(cell.imageAlt || title)}" loading="lazy" decoding="async"><span class="traffic-image-label" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg></span></button>`;
          }
          const body = cell.runs?.some((run) => cellUrl(run))
            ? cell.runs.map((run) => trafficTextMarkup(run.text, run.url)).join('')
            : trafficTextMarkup(cellText(cell), cellUrl(cell));
          return body ? `<div class="traffic-supplement">${body}</div>` : '';
        }).join('');
        return `<div class="schedule-traffic">
          <div class="traffic-heading"><svg class="traffic-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="3" width="14" height="16" rx="3"/><path d="M5 8h14M5 14h14M8 19v2m8-2v2M8 5h8"/><circle cx="8" cy="16.5" r=".6"/><circle cx="16" cy="16.5" r=".6"/></svg><span>${escapeHtml(title)}</span></div>
          <div class="traffic-actions"><span class="traffic-map-slot"></span>
          <details class="traffic-notes"><summary>交通筆記</summary>
          <div class="traffic-body">
            ${information || '<p class="traffic-empty">尚未填寫照片或交通補充。</p>'}
          </div>
          </details></div>
        </div>`;
      }).join('');
    }

    function trafficTextMarkup(text, url) {
      if (cellUrl({ url })) return linkMarkup({ text, url });
      // Keep plain text and several pasted links readable without accepting HTML.
      return String(text || '').split(/(https?:\/\/[^\s<>"']+)/gi).map((part) =>
        /^https?:\/\//i.test(part) ? linkMarkup({ text: part, url: part }) : escapeHtml(part)).join('');
    }

    function initializeTrafficImages() {
      document.querySelectorAll('.schedule-traffic').forEach((traffic) => {
        const buttons = Array.from(traffic.querySelectorAll('.traffic-image'));
        buttons.forEach((button, index) => {
          if (buttons.length > 1) button.setAttribute('aria-label', `${button.getAttribute('aria-label')}（第 ${index + 1} 張，共 ${buttons.length} 張）`);
          enableSheetImageRecovery(button.querySelector('img'), button, button.querySelector('.traffic-image-label'));
          button.addEventListener('click', () => openSpotImageDialog(buttons, index));
        });
      });
    }

    function formatTime(value) {
      const raw = String(value ?? '').trim();
      const match = raw.match(/^(\d{1,2}):(\d{2})/);
      return match ? `${match[1].padStart(2, '0')}:${match[2]}` : raw;
    }

    function splitEvent(cell, fallbackTime) {
      const raw = cellText(cell);
      const match = raw.match(/^([01]?\d|2[0-3]):([0-5]\d)(?:\s+|$)([\s\S]*)$/);
      const text = match && match[3].trim() ? match[3].trim() : raw;
      const route = text.match(/^([A-Z]{3})\s*(?:->|>|→)\s*([A-Z]{3})$/);
      return {
        time: match ? formatTime(`${match[1]}:${match[2]}`) : route ? '' : fallbackTime,
        text: route ? `${route[1]} → ${route[2]}` : text,
        isJourney: Boolean(route && !match),
        note: cell?.note || '',
        url: cellUrl(cell)
      };
    }

    function parseDate(value) {
      const raw = String(value ?? '').trim();
      const match = raw.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s*\(([^)]+)\)/);

      if (!match) return { monthDay: raw, weekday: '', full: raw };

      const monthDay = `${match[2].padStart(2, '0')}/${match[3].padStart(2, '0')}`;
      return {
        monthDay,
        weekday: match[4],
        full: `${match[1]}/${match[2].padStart(2, '0')}/${match[3].padStart(2, '0')}（${match[4]}）`
      };
    }

    function isAccommodationText(value) {
      return /\b(?:hotel|inn)\b/i.test(String(value || ''));
    }

    function scheduleCard(rows, column, index, totalColumns, traffic = []) {
      const dateCell = rows[0]?.[column];
      const placeCell = rows[1]?.[column];
      const date = parseDate(cellText(dateCell));
      // Compare the full date using the visitor's device timezone.
      const dateParts = cellText(dateCell).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
      const today = new Date();
      const isToday = dateParts && Number(dateParts[1]) === today.getFullYear()
        && Number(dateParts[2]) === today.getMonth() + 1
        && Number(dateParts[3]) === today.getDate();
      const place = cellText(placeCell);
      const events = [];

      for (let rowIndex = 2; rowIndex < rows.length; rowIndex += 1) {
        const cell = rows[rowIndex]?.[column];
        if (!cellText(cell)) continue;
        // Expanded merged cells retain their bounds; render once per day column.
        if (Number.isInteger(cell.mergeStartRow) && rowIndex > cell.mergeStartRow) continue;
        const startTime = formatTime(cellText(rows[rowIndex]?.[0]));
        events.push(splitEvent(cell, startTime));
      }

      const lastEventIndex = events.length - 1;
      const displayEvents = events
        .map((event, eventIndex) => ({
          ...event,
          isAccommodation: eventIndex === lastEventIndex && isAccommodationText(event.text),
        }))
        .filter((event) => !(index === totalColumns && event.isAccommodation));
      const isFlightDay = displayEvents.some((event) => /IT714|IT715|TPE|OKJ|機場|起飛|降落/.test(event.text));
      const title = index === 1 ? '抵達日本' : index === 8 ? '回程' : (place || '彈性安排');
      const label = place || (index === 1 ? '旅程起點' : index === totalColumns ? '踏上歸途' : '自由探索');
      const tag = isFlightDay ? '航班日' : displayEvents.length ? '行程' : '待補';

      const eventMarkup = displayEvents.length
        ? `<div class="events">${displayEvents.map((event) => `
            ${trafficNoteMarkup(event.note, traffic)}
            <div class="event${event.isAccommodation ? ' accommodation-event' : ''}${event.isJourney ? ' journey-event' : ''}">
              ${event.isAccommodation ? '' : `<div class="event-time">${escapeHtml(event.time)}</div>`}
              <div class="event-text">${event.isJourney ? '<span class="journey-icon" aria-hidden="true">✈</span>' : ''}${linkMarkup({ text: event.text, url: event.url })}</div>
            </div>`).join('')}</div>`
        : '<div class="empty-day">這一天還留著空白，給旅途一點隨興的空間。</div>';

      return `<details class="day-card" id="trip-day-${index}"${isToday ? ' data-today="true" open' : ''}>
        <summary class="day-label">
          <div class="day-number">DAY ${String(index).padStart(2, '0')}</div>
          <div class="day-date">${escapeHtml(date.monthDay)}${date.weekday ? `<span class="day-weekday">週${escapeHtml(date.weekday)}</span>` : ''}</div>
          <div class="day-place">${escapeHtml(label)}</div>
        </summary>
        <div class="day-body">
          <div class="day-title"><h3>${escapeHtml(title)}</h3><span class="tag">${escapeHtml(tag)}</span></div>
          ${eventMarkup}
        </div>
      </details>`;
    }

    function enableScheduleAnimation() {
      document.querySelectorAll('.day-card').forEach((card) => {
        const summary = card.querySelector('summary');
        let animation = null;
        let expanded = card.open;
        card.addEventListener('schedule-open', () => {
          if (animation) {
            animation.onfinish = null;
            animation.cancel();
            animation = null;
          }
          expanded = true;
          card.open = true;
        });
        summary.addEventListener('click', (event) => {
          if (event.target.closest('a, button')) return;
          event.preventDefault();
          const startHeight = card.getBoundingClientRect().height;
          expanded = !expanded;
          if (animation) {
            animation.onfinish = null;
            animation.cancel();
            animation = null;
          }
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !card.animate) {
            card.open = expanded;
            return;
          }
          // Measure natural dimensions, including borders, without leaving a fixed height.
          card.open = expanded;
          const endHeight = card.getBoundingClientRect().height;
          card.open = true;
          animation = card.animate(
            [{ height: `${startHeight}px` }, { height: `${endHeight}px` }],
            { duration: 260, easing: 'cubic-bezier(0.2, 0, 0, 1)' }
          );
          animation.onfinish = () => {
            card.open = expanded;
            animation = null;
          };
        });
      });
    }

    function initializeScheduleNavigation() {
      const cards = Array.from(document.querySelectorAll('.day-card'));
      const todayCard = cards.find((card) => card.dataset.today === 'true');
      const target = todayCard || cards[0];
      const picker = document.getElementById('day-picker');
      const navigation = document.getElementById('day-navigation');
      if (!picker || !navigation || !target) return;

      // Keep every day in the document so maps and desktop accordions retain their state.
      const selectDay = (card, scroll) => {
        card.dispatchEvent(new Event('schedule-open'));
        picker.querySelectorAll('button').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.getAttribute('aria-controls') === card.id));
        });
        if (scroll) {
          card.querySelector('summary').focus({ preventScroll: true });
          card.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth', block: 'start' });
        }
      };
      picker.replaceChildren();
      cards.forEach((card, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('aria-controls', card.id);
        button.setAttribute('aria-pressed', String(card === target));
        const date = card.querySelector('.day-date').cloneNode(true);
        const label = document.createElement('span');
        label.className = 'picker-day-label';
        label.textContent = card === todayCard ? '今天' : `第 ${index + 1} 天`;
        button.append(label, date);
        button.addEventListener('click', () => selectDay(card, true));
        picker.append(button);
      });
      navigation.hidden = false;
      document.getElementById('day-navigation-hint').textContent = todayCard ? '今天的行程已展開' : '左右滑動查看日期';
      if (todayCard || window.matchMedia('(max-width: 760px)').matches) selectDay(target, false);
      const selected = picker.querySelector('[aria-pressed="true"]');
      picker.scrollLeft = selected.offsetLeft - picker.offsetLeft;
    }

    function renderSchedule(rows, traffic = []) {
      const columns = 8;
      const firstDate = parseDate(cellText(rows[0]?.[1]));
      const lastDate = parseDate(cellText(rows[0]?.[columns]));
      document.getElementById('trip-dates').textContent = `${firstDate.full} — ${lastDate.full}`;
      document.getElementById('schedule-grid').innerHTML = Array.from(
        { length: columns },
        (_, index) => scheduleCard(rows, index + 1, index + 1, columns, traffic)
      ).join('');
      enableScheduleAnimation();
      initializeScheduleNavigation();
      initializeTrafficImages();

      const sidePlace = cellText(rows[1]?.[10]);
      const sideItems = [];
      for (let rowIndex = 2; rowIndex < rows.length; rowIndex += 1) {
        const cell = rows[rowIndex]?.[10];
        if (Number.isInteger(cell?.mergeStartRow) && rowIndex > cell.mergeStartRow) continue;
        if (cellText(cell)) sideItems.push(cell);
      }

      if (!sidePlace && !sideItems.length) {
        document.getElementById('schedule-notes').innerHTML = '';
        return;
      }

      document.getElementById('schedule-notes').innerHTML = `<div class="note-card" style="margin-top: 18px;">
        <h3>${escapeHtml(sidePlace || '其他景點備忘')}</h3>
        <p>先收藏起來，留給旅途中的自由時光。</p>
        <div class="chip-list">${sideItems.map((cell) => `<span class="place-chip">${linkMarkup(cell)}</span>`).join('')}</div>
      </div>`;
    }
  </script>
